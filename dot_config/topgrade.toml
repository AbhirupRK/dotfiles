[misc]
pre_sudo = true       # Prompt for sudo once at the beginning
assume_yes = false    # Don't ask for confirmation before each step

# Disable these steps
disable = [           # Disable the following
    # "system",       # System software update
    # "brew",
    # "shell",        # e.g. oh-my-zsh
    "miktex",         # MikTeX
]

# Only run these steps, ignoring everything else (alternative to `disable`)
# only = ["brew", "commands"]

# ignore_failures = ["commands"]

# Cleanup caches and old packages after updates finish
cleanup = true

[brew]
greedy_cask = true
autoremove = true

# [mas]    # Upgrade Mac App Store apps (requires `mas` CLI installed via brew)
# upgrade = true

[commands]    # Custom commands
# "Update MiKTeX" = "mpm --update"    # Custom update command for miktex packages
"Brew cleanup" = "brew cleanup --prune=all"