set -g default-terminal "screen-256color"

# Enable terminal titles and set format
set-option -g set-titles on
set-option -g set-titles-string "#S: #W"

# Enable more prefixes
set-option -g prefix2 C-a

# Enable mouse mode
set -g mouse on

# Start counting pane and window number at 1
set -g base-index 1
setw -g pane-base-index 1

# Zoom pane using Ctrl+Z
bind -n C-z resize-pane -Z

# split panes using | and - ; equal layout using =
bind '\' split-window -h
bind '-' split-window -v
bind '=' select-layout tiled

# switch panes using Alt-arrow without prefix
bind -n C-S-Left  select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

# Custom scroll speed (inside copy-mode)
bind-key -T copy-mode WheelUpPane send-keys -N 1 -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -N 1 -X scroll-down


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore when tmux starts
set -g @continuum-restore 'on'
# Save interval in minutes (default is 15)
set -g @continuum-save-interval '60'
# Optional: Restore shell history and pane contents
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
